<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" href="./assets/image.png">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="d-flex flex-column min-vh-100">

<div id="navbar-container"></div>

<main class="flex-grow-1">

  <!-- BIENVENIDA -->
  <section class="py-5 text-center container">
    <div class="row py-lg-4">
      <div class="col-lg-6 col-md-8 mx-auto">
        <h1 class="fw-light">
          Bienvenido, <span id="username">...</span>
        </h1>
        <p class="lead text-body-secondary" id="institucion"></p>

        <!-- Botón solo para admin/docente -->
        <a href="manage-courses.html" id="manage-courses-btn" class="btn btn-outline-primary d-none">
          📚 Gestionar cursos
        </a>
      </div>
    </div>
  </section>

  <!-- CURSOS (estudiante: tabs; admin/docente: lista simple) -->
  <div class="bg-body-tertiary py-5">
    <div class="container">

      <!-- Vista estudiante: tabs -->
      <div id="student-view" class="d-none">
        <ul class="nav nav-tabs mb-4" id="courseTabs">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-mis-cursos">
              Mis cursos
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-explorar">
              Explorar
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- Mis cursos (inscritos) -->
          <div class="tab-pane fade show active" id="tab-mis-cursos">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4" id="enrolled-courses">
              <div class="col-12 text-center py-4">
                <div class="spinner-border spinner-border-sm" role="status"></div>
              </div>
            </div>
          </div>

          <!-- Explorar todos los cursos -->
          <div class="tab-pane fade" id="tab-explorar">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4" id="all-courses">
              <div class="col-12 text-center py-4">
                <div class="spinner-border spinner-border-sm" role="status"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Vista admin/docente: todos los cursos -->
      <div id="staff-view" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h5 class="mb-0">Todos los cursos</h5>
          <a href="manage-courses.html" class="btn btn-sm btn-primary">Ver gestión completa →</a>
        </div>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4" id="staff-courses">
          <div class="col-12 text-center py-4">
            <div class="spinner-border spinner-border-sm" role="status"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

</main>

<div id="footer-container"></div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
import { setTitle, loadFooter } from './js/ui.js';
import { requireAuth, authFetch } from './js/auth.js';
import { INSTITUCION, API_BASE_URL } from './js/config.js';
import { loadNavbar } from './js/navbar.js';

setTitle('Inicio');
requireAuth();
loadFooter();

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function courseCard(course, { enrolled = false, showEnrollBtn = false } = {}) {
  const enrolledBadge = enrolled
    ? `<span class="badge bg-success mb-2">Inscrito</span>`
    : '';

  const actionBtn = showEnrollBtn && !enrolled
    ? `<button class="btn btn-sm btn-primary mt-2 enroll-btn" data-id="${course.id}">Matricularse</button>`
    : enrolled
      ? `<button class="btn btn-sm btn-outline-danger mt-2 unenroll-btn" data-id="${course.id}">Cancelar matrícula</button>`
      : '';

  return `
    <div class="col">
      <div class="card shadow-sm h-100">
        <div class="card-body d-flex flex-column">
          ${enrolledBadge}
          <h5 class="card-title">${escapeHTML(course.name || course.title || 'Sin título')}</h5>
          <p class="card-text text-body-secondary flex-grow-1">${escapeHTML(course.description || '')}</p>
          ${actionBtn}
        </div>
      </div>
    </div>
  `;
}

function emptyState(msg) {
  return `<div class="col-12 text-center py-4 text-body-secondary"><p class="mb-0">${msg}</p></div>`;
}

function errorState(msg) {
  return `<div class="col-12 text-center py-4 text-danger"><p class="mb-0">${msg}</p></div>`;
}

// --- ESTUDIANTE ---
async function cargarMisCursos() {
  const container = document.getElementById('enrolled-courses');
  try {
    const res    = await authFetch(`${API_BASE_URL}/enrollments/my-courses`);
    const result = await res.json();

    if (!res.ok || !result.success) throw new Error();

    const courses = Array.isArray(result.data) ? result.data : (result.data?.courses ?? []);

    container.innerHTML = courses.length
      ? courses.map(c => courseCard(c.course ?? c, { enrolled: true })).join('')
      : emptyState('No estás inscrito en ningún curso todavía.');
  } catch {
    container.innerHTML = errorState('Error al cargar tus cursos.');
  }
}

async function cargarTodosParaExplorar(enrolledIds) {
  const container = document.getElementById('all-courses');
  try {
    const res    = await authFetch(`${API_BASE_URL}/courses`);
    const result = await res.json();

    if (!res.ok || !result.success) throw new Error();

    const courses = Array.isArray(result.data) ? result.data : (result.data?.courses ?? []);

    container.innerHTML = courses.length
      ? courses.map(c => courseCard(c, {
          enrolled: enrolledIds.has(c.id),
          showEnrollBtn: true
        })).join('')
      : emptyState('No hay cursos disponibles aún.');
  } catch {
    container.innerHTML = errorState('Error al cargar los cursos.');
  }
}

async function obtenerEnrolledIds() {
  try {
    const res    = await authFetch(`${API_BASE_URL}/enrollments/my-courses`);
    const result = await res.json();
    if (!res.ok || !result.success) return new Set();
    const courses = Array.isArray(result.data) ? result.data : (result.data?.courses ?? []);
    return new Set(courses.map(c => (c.course ?? c).id));
  } catch {
    return new Set();
  }
}

// --- ADMIN / DOCENTE ---
async function cargarCursosStaff() {
  const container = document.getElementById('staff-courses');
  try {
    const res    = await authFetch(`${API_BASE_URL}/courses`);
    const result = await res.json();

    if (!res.ok || !result.success) throw new Error();

    const courses = Array.isArray(result.data) ? result.data : (result.data?.courses ?? []);

    container.innerHTML = courses.length
      ? courses.map(c => courseCard(c)).join('')
      : emptyState('No hay cursos creados todavía.');
  } catch {
    container.innerHTML = errorState('Error al cargar los cursos.');
  }
}

// --- MATRÍCULA / CANCELAR ---
async function manejarMatricula(courseId, action) {
  const method = action === 'enroll' ? 'POST' : 'DELETE';
  try {
    const res = await authFetch(`${API_BASE_URL}/enrollments/${courseId}`, { method });
    const result = await res.json();
    if (res.ok && result.success) {
      // Recargar ambas secciones
      cargarMisCursos();
      obtenerEnrolledIds().then(ids => cargarTodosParaExplorar(ids));
    } else {
      alert(result.message || 'No se pudo completar la acción.');
    }
  } catch {
    alert('Error de conexión.');
  }
}

document.addEventListener('click', (e) => {
  if (e.target.classList.contains('enroll-btn')) {
    manejarMatricula(e.target.dataset.id, 'enroll');
  }
  if (e.target.classList.contains('unenroll-btn')) {
    manejarMatricula(e.target.dataset.id, 'unenroll');
  }
});

// --- INIT ---
async function init() {
  const user = await loadNavbar({ activePage: 'inicio' });
  if (!user) return;

  const fullName = `${user.first_name} ${user.last_name}`;
  document.getElementById('username').textContent = fullName;
  document.getElementById('institucion').textContent = `${INSTITUCION} te da la bienvenida`;

  const isStudent = user.role === 'student';
  const isStaff   = user.role === 'admin' || user.role === 'teacher' || user.is_admin === true;

  if (isStaff) {
    document.getElementById('manage-courses-btn').classList.remove('d-none');
    document.getElementById('staff-view').classList.remove('d-none');
    cargarCursosStaff();
  }

  if (isStudent) {
    document.getElementById('student-view').classList.remove('d-none');
    cargarMisCursos();
    obtenerEnrolledIds().then(ids => cargarTodosParaExplorar(ids));
  }
}

init();
</script>

</body>
</html>
