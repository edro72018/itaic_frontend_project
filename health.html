<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Health Check</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main>
    <div class="container">
      <h1 class="text-center mt-5">Health Check API</h1>

      <!-- Alerta de estado -->
      <div id="alert-container" class="mt-4"></div>

      <div class="text-center mt-3">
        <button id="check-btn" class="btn btn-primary">Comprobar conexión</button>
      </div>
    </div>
  </main>

  <script>
    const alertContainer = document.getElementById('alert-container');
    const checkBtn = document.getElementById('check-btn');

    checkBtn.addEventListener('click', async () => {
      // Limpiar alertas anteriores
      alertContainer.innerHTML = '';

      try {
        const response = await fetch(`${HEALTH_CHECK_URL}`);

        if (response.ok) {
          const data = await response.json();
          alertContainer.innerHTML = `
            <div class="alert alert-success" role="alert">
              Conexión exitosa! Estado: ${data.status || 'OK'}
            </div>
          `;
        } else {
          alertContainer.innerHTML = `
            <div class="alert alert-danger" role="alert">
              La API respondió con error: ${response.status}
            </div>
          `;
        }
      } catch (error) {
        console.error(error);
        alertContainer.innerHTML = `
          <div class="alert alert-danger" role="alert">
            No se pudo conectar con la API
          </div>
        `;
      }
    });
  </script>
</body>
</html>
