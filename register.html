<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" href="./assets/image.png">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="d-flex flex-column min-vh-100">

<div id="navbar-container"></div>

<!-- CONTENIDO -->
<main class="flex-grow-1 py-5">
  <div class="container">

    <!-- Acceso denegado -->
    <div id="access-denied" class="d-none text-center py-5">
      <h2 class="text-danger">Acceso denegado</h2>
      <p class="text-body-secondary">Solo los administradores pueden registrar nuevos usuarios.</p>
      <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
    </div>

    <!-- Formulario de registro -->
    <div id="register-section" class="d-none">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

          <h2 class="mb-1">Registrar nuevo usuario</h2>
          <p class="text-body-secondary mb-4">Solo los administradores pueden crear cuentas.</p>

          <div id="alert-container" class="mb-3"></div>

          <form id="register-form">

            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label for="first-name" class="form-label">Primer Nombre</label>
                <input type="text" class="form-control" id="first-name" placeholder="Juan" required>
              </div>
              <div class="col-sm-6">
                <label for="second-name" class="form-label">Segundo Nombre</label>
                <input type="text" class="form-control" id="second-name" placeholder="José" required>
              </div>
              <div class="col-sm-6">
                <label for="last-name" class="form-label">Primer Apellido</label>
                <input type="text" class="form-control" id="last-name" placeholder="Pérez" required>
              </div>
              <div class="col-sm-6">
                <label for="second-last-name" class="form-label">Segundo Apellido</label>
                <input type="text" class="form-control" id="second-last-name" placeholder="Gómez" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" placeholder="usuario@ejemplo.com" required>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
              </div>
              <div class="col-sm-6">
                <label for="confirm-password" class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" id="confirm-password" placeholder="Repetir contraseña" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="role" class="form-label">Rol</label>
              <select class="form-select" id="role" required>
                <option value="" disabled selected>Seleccionar rol...</option>
                <option value="student">Estudiante</option>
                <option value="teacher">Docente</option>
                <option value="admin">Administrador</option>
              </select>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary" id="submit-btn">
                Registrar usuario
              </button>
              <a href="index.html" class="btn btn-outline-secondary">Cancelar</a>
            </div>

          </form>

        </div>
      </div>
    </div>

    <!-- Spinner mientras verifica -->
    <div id="loading-section" class="text-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Verificando permisos...</span>
      </div>
    </div>

  </div>
</main>

<!-- FOOTER -->
<div id="footer-container"></div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
import { setTitle, loadFooter } from './js/ui.js';
import { requireAuth, authFetch } from './js/auth.js';
import { API_BASE_URL } from './js/config.js';
import { loadNavbar } from './js/navbar.js';

setTitle('Registrar Usuario');
requireAuth();
loadFooter();

async function init() {
  const loadingSection  = document.getElementById('loading-section');
  const registerSection = document.getElementById('register-section');
  const accessDenied    = document.getElementById('access-denied');

  // loadNavbar devuelve el usuario y ya verifica /auth/me
  const user = await loadNavbar({ activePage: 'registro' });

  loadingSection.classList.add('d-none');

  if (!user) {
    accessDenied.classList.remove('d-none');
    return;
  }

  const isAdmin = user.role === 'admin' || user.is_admin === true;

  if (isAdmin) {
    registerSection.classList.remove('d-none');
  } else {
    accessDenied.classList.remove('d-none');
  }
}

// --- FORMULARIO ---
const form           = document.getElementById('register-form');
const alertContainer = document.getElementById('alert-container');
const submitBtn      = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertContainer.innerHTML = '';

  const firstName     = document.getElementById('first-name').value.trim();
  const secondName    = document.getElementById('second-name').value.trim();
  const lastName      = document.getElementById('last-name').value.trim();
  const secondLastName = document.getElementById('second-last-name').value.trim();
  const email         = document.getElementById('email').value.trim();
  const password      = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirm-password').value;
  const role          = document.getElementById('role').value;

  if (password !== confirmPassword) {
    alertContainer.innerHTML = `<div class="alert alert-warning">Las contraseñas no coinciden.</div>`;
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Registrando...';

  try {
    const response = await authFetch(`${API_BASE_URL}/auth/register`, {
      method: 'POST',
      body: JSON.stringify({
        first_name: firstName,
        second_name: secondName,
        last_name: lastName,
        second_last_name: secondLastName,
        email,
        password,
        role
      })
    });

    const data = await response.json();

    if (response.ok && data.success) {
      alertContainer.innerHTML = `
        <div class="alert alert-success">
          Usuario <strong>${firstName} ${lastName}</strong> registrado exitosamente.
        </div>
      `;
      form.reset();
    } else {
      alertContainer.innerHTML = `
        <div class="alert alert-danger">
          ${data.message || 'No se pudo registrar el usuario.'}
        </div>
      `;
    }
  } catch (error) {
    console.error('Error al registrar usuario:', error);
    alertContainer.innerHTML = `<div class="alert alert-danger">Error de conexión al registrar el usuario.</div>`;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Registrar usuario';
  }
});

init();
</script>

</body>
</html>
