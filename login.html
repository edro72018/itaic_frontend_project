<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title></title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="icon" href="assets/image.png">

  <!-- Estilo tipo Bootstrap Sign-in -->
  <style>
    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      padding-top: 40px;
      padding-bottom: 40px;
      background-color: var(--bs-body-bg);
    }

    .form-signin {
      max-width: 330px;
      padding: 15px;
    }

    .form-signin .form-floating:focus-within {
      z-index: 2;
    }

    .form-signin input[type="email"] {
      margin-bottom: -1px;
      border-bottom-right-radius: 0;
      border-bottom-left-radius: 0;
    }

    .form-signin input[type="password"] {
      margin-bottom: 10px;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }
  </style>

</head>

<body class="text-center d-flex flex-column min-vh-100">

  <main class="form-signin w-100 m-auto">

    <form id="login-form">

      <img class="mb-4" src="assets/image.png" alt="ITAIC" width="72">

      <h1 class="h5 mb-3 fw-normal">
        Instituto Teológico De Las Asambleas De Iglesias Cristianas
      </h1>

      <div class="form-floating">
        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
        <label for="email">Correo electrónico</label>
      </div>

      <div class="form-floating">
        <input type="password" class="form-control" id="password" placeholder="Password" required>
        <label for="password">Contraseña</label>
      </div>

      <!-- ALERTAS -->
      <div id="alert-container" class="my-2"></div>

      <button class="w-100 btn btn-lg btn-primary mt-2" type="submit">
        Iniciar sesión
      </button>

    </form>

  </main>

  <!-- Footer dinámico -->
  <div id="footer-container" class="mt-auto"></div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- LOGIN -->
  <script>
    const form = document.getElementById('login-form');
    const alertContainer = document.getElementById('alert-container');

    const token = localStorage.getItem('token');

    // 🔐 Si ya está logueado
    if (token && token !== "undefined" && token !== "null") {
      window.location.href = 'index.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertContainer.innerHTML = '';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://localhost:8000/api/v1/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {

          localStorage.setItem('token', data.data.access_token);
          localStorage.setItem('user', JSON.stringify(data.data.user));

          window.location.href = 'index.html';

        } else {
          alertContainer.innerHTML = `
            <div class="alert alert-danger">
              ${data.message || 'Credenciales incorrectas'}
            </div>
          `;
        }

      } catch (error) {
        console.error(error);
        alertContainer.innerHTML = `
          <div class="alert alert-danger">
            No se pudo conectar con el servidor
          </div>
        `;
      }
    });
  </script>

  <!-- UI -->
  <script type="module">
    import { setTitle, loadFooter } from './js/ui.js';

    setTitle('Login');
    loadFooter();
  </script>

</body>
</html>
