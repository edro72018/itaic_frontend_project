<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" href="assets/image.png">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    html, body { height: 100%; }

    body {
      display: flex;
      align-items: center;
      padding-top: 40px;
      padding-bottom: 40px;
      background-color: var(--bs-body-bg);
    }

    .form-signin {
      max-width: 330px;
      padding: 15px;
    }

    .form-signin .form-floating:focus-within { z-index: 2; }

    .form-signin input[type="email"] {
      margin-bottom: -1px;
      border-bottom-right-radius: 0;
      border-bottom-left-radius: 0;
    }

    .form-signin input[type="password"] {
      margin-bottom: 10px;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }
  </style>
</head>

<body class="text-center d-flex flex-column min-vh-100">

  <main class="form-signin w-100 m-auto">
    <form id="login-form">
      <img class="mb-4" src="assets/image.png" alt="ITAIC" width="72">

      <h1 class="h5 mb-3 fw-normal" id="institution-name"></h1>

      <div class="form-floating">
        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
        <label for="email">Correo electrónico</label>
      </div>

      <div class="form-floating">
        <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
        <label for="password">Contraseña</label>
      </div>

      <div id="alert-container" class="my-2"></div>

      <button class="w-100 btn btn-lg btn-primary mt-2" type="submit" id="submit-btn">
        Iniciar sesión
      </button>
    </form>
  </main>

  <div id="footer-container" class="mt-auto"></div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { setTitle, loadFooter } from './js/ui.js';
    import { INSTITUCION, API_BASE_URL } from './js/config.js';
    import { setToken } from './js/auth.js';
    import { initTheme } from './js/theme.js';

    setTitle('Iniciar Sesión');
    loadFooter();
    initTheme();

    document.getElementById('institution-name').textContent = INSTITUCION;

    // Redirigir si ya tiene sesión
    const token = localStorage.getItem('token');
    if (token && token !== 'undefined' && token !== 'null') {
      window.location.href = 'index.html';
    }

    const form = document.getElementById('login-form');
    const alertContainer = document.getElementById('alert-container');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertContainer.innerHTML = '';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Iniciando sesión...';

      try {
        const response = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          setToken(data.data.access_token);
          localStorage.setItem('user', JSON.stringify(data.data.user));
          window.location.href = 'index.html';
        } else {
          alertContainer.innerHTML = `
            <div class="alert alert-danger">
              ${data.message || 'Credenciales incorrectas'}
            </div>
          `;
        }
      } catch (error) {
        console.error(error);
        alertContainer.innerHTML = `
          <div class="alert alert-danger">
            No se pudo conectar con el servidor
          </div>
        `;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Iniciar sesión';
      }
    });
  </script>

</body>
</html>
