<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" href="./assets/image.png">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    .profile-avatar {
      width: 100px;
      height: 100px;
      font-size: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .edit-field { max-width: 220px; }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

<div id="navbar-container"></div>

<main class="flex-grow-1 py-5">
  <div class="container">

    <!-- Spinner -->
    <div id="loading-section" class="text-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Cargando perfil...</span>
      </div>
    </div>

    <!-- Perfil -->
    <div id="profile-section" class="d-none">
      <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

          <!-- Encabezado con avatar y nombre -->
          <div class="d-flex align-items-center gap-4 mb-4">
            <div class="profile-avatar rounded-circle bg-primary text-white flex-shrink-0" id="avatar-initials"></div>
            <div>
              <h2 class="mb-0" id="profile-fullname"></h2>
              <span class="badge rounded-pill mt-1" id="profile-role-badge"></span>
            </div>
          </div>

          <!-- Alerta de edición -->
          <div id="edit-alert" class="mb-3 d-none"></div>

          <!-- Card de datos -->
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <h5 class="mb-0">Información personal</h5>
              <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-primary" id="btn-edit">Editar</button>
                <button class="btn btn-sm btn-primary d-none" id="btn-save">Guardar</button>
                <button class="btn btn-sm btn-outline-secondary d-none" id="btn-cancel">Cancelar</button>
              </div>
            </div>

            <ul class="list-group list-group-flush">

              <li class="list-group-item d-flex justify-content-between align-items-center">
                <span class="text-body-secondary">Primer nombre</span>
                <span id="profile-first-name" class="fw-medium view-field"></span>
                <input type="text" id="edit-first-name" class="form-control form-control-sm edit-field d-none" placeholder="Primer nombre">
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center" id="row-second-name">
                <span class="text-body-secondary">Segundo nombre</span>
                <span id="profile-second-name" class="fw-medium view-field"></span>
                <input type="text" id="edit-second-name" class="form-control form-control-sm edit-field d-none" placeholder="Segundo nombre (opcional)">
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center">
                <span class="text-body-secondary">Primer apellido</span>
                <span id="profile-last-name" class="fw-medium view-field"></span>
                <input type="text" id="edit-last-name" class="form-control form-control-sm edit-field d-none" placeholder="Primer apellido">
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center" id="row-second-last-name">
                <span class="text-body-secondary">Segundo apellido</span>
                <span id="profile-second-last-name" class="fw-medium view-field"></span>
                <input type="text" id="edit-second-last-name" class="form-control form-control-sm edit-field d-none" placeholder="Segundo apellido (opcional)">
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center">
                <span class="text-body-secondary">Correo electrónico</span>
                <span id="profile-email" class="fw-medium text-body-secondary fst-italic"></span>
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center" id="row-created-at">
                <span class="text-body-secondary">Miembro desde</span>
                <span id="profile-created-at" class="fw-medium"></span>
              </li>

            </ul>
          </div>

        </div>
      </div>
    </div>

    <!-- Error -->
    <div id="error-section" class="d-none text-center py-5">
      <p class="text-danger">No se pudo cargar el perfil.</p>
      <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
    </div>

  </div>
</main>

<div id="footer-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
import { setTitle, loadFooter } from './js/ui.js';
import { requireAuth, authFetch } from './js/auth.js';
import { API_BASE_URL } from './js/config.js';
import { loadNavbar } from './js/navbar.js';

setTitle('Mi Perfil');
requireAuth();
loadFooter();

const ROLE_LABELS = {
  admin:   { label: 'Administrador', cls: 'bg-danger'  },
  teacher: { label: 'Docente',       cls: 'bg-success' },
  student: { label: 'Estudiante',    cls: 'bg-primary' },
};

let currentUser = null;

function formatDate(dateStr) {
  if (!dateStr) return null;
  return new Date(dateStr).toLocaleDateString('es', {
    year: 'numeric', month: 'long', day: 'numeric'
  });
}

function setText(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value ?? '';
}

function renderUser(user) {
  const fullName = [user.first_name, user.second_name, user.last_name, user.second_last_name]
    .filter(Boolean).join(' ');

  const initials = [user.first_name, user.last_name]
    .filter(Boolean).map(n => n[0].toUpperCase()).join('');

  document.getElementById('avatar-initials').textContent = initials;
  setText('profile-fullname', fullName);

  const roleInfo = ROLE_LABELS[user.role] ?? { label: user.role ?? 'Usuario', cls: 'bg-secondary' };
  const badge = document.getElementById('profile-role-badge');
  badge.className = `badge rounded-pill mt-1 ${roleInfo.cls}`;
  badge.textContent = roleInfo.label;

  setText('profile-first-name', user.first_name);
  setText('profile-last-name', user.last_name);
  setText('profile-email', user.email);

  // Segundo nombre
  const rowSecondName = document.getElementById('row-second-name');
  if (user.second_name) {
    setText('profile-second-name', user.second_name);
    rowSecondName.classList.remove('d-none');
  } else {
    rowSecondName.classList.add('d-none');
  }

  // Segundo apellido
  const rowSecondLastName = document.getElementById('row-second-last-name');
  if (user.second_last_name) {
    setText('profile-second-last-name', user.second_last_name);
    rowSecondLastName.classList.remove('d-none');
  } else {
    rowSecondLastName.classList.add('d-none');
  }

  // Fecha
  const createdAt = formatDate(user.created_at);
  const rowCreatedAt = document.getElementById('row-created-at');
  if (createdAt) {
    setText('profile-created-at', createdAt);
    rowCreatedAt.classList.remove('d-none');
  } else {
    rowCreatedAt.classList.add('d-none');
  }
}

// --- MODO EDICIÓN ---
function enterEditMode() {
  // Mostrar todas las filas opcionales en modo edición
  document.getElementById('row-second-name').classList.remove('d-none');
  document.getElementById('row-second-last-name').classList.remove('d-none');

  // Rellenar inputs con valores actuales
  document.getElementById('edit-first-name').value      = currentUser.first_name      ?? '';
  document.getElementById('edit-second-name').value     = currentUser.second_name     ?? '';
  document.getElementById('edit-last-name').value       = currentUser.last_name       ?? '';
  document.getElementById('edit-second-last-name').value = currentUser.second_last_name ?? '';

  // Alternar visibilidad
  document.querySelectorAll('.view-field').forEach(el => el.classList.add('d-none'));
  document.querySelectorAll('.edit-field').forEach(el => el.classList.remove('d-none'));

  document.getElementById('btn-edit').classList.add('d-none');
  document.getElementById('btn-save').classList.remove('d-none');
  document.getElementById('btn-cancel').classList.remove('d-none');
  document.getElementById('edit-alert').classList.add('d-none');
}

function exitEditMode() {
  document.querySelectorAll('.view-field').forEach(el => el.classList.remove('d-none'));
  document.querySelectorAll('.edit-field').forEach(el => el.classList.add('d-none'));

  document.getElementById('btn-edit').classList.remove('d-none');
  document.getElementById('btn-save').classList.add('d-none');
  document.getElementById('btn-cancel').classList.add('d-none');
  document.getElementById('edit-alert').classList.add('d-none');

  // Restaurar filas opcionales si estaban vacías
  renderUser(currentUser);
}

function showEditAlert(message, type = 'danger') {
  const el = document.getElementById('edit-alert');
  el.className = `mb-3 alert alert-${type}`;
  el.textContent = message;
}

async function saveChanges() {
  const firstName      = document.getElementById('edit-first-name').value.trim();
  const secondName     = document.getElementById('edit-second-name').value.trim();
  const lastName       = document.getElementById('edit-last-name').value.trim();
  const secondLastName = document.getElementById('edit-second-last-name').value.trim();

  if (!firstName || !lastName) {
    showEditAlert('El primer nombre y primer apellido son obligatorios.');
    return;
  }

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    const res    = await authFetch(`${API_BASE_URL}/auth/me`, {
      method: 'PUT',
      body: JSON.stringify({
        first_name:       firstName,
        second_name:      secondName   || null,
        last_name:        lastName,
        second_last_name: secondLastName || null,
      })
    });
    const result = await res.json();

    if (res.ok && result.success) {
      currentUser = { ...currentUser, ...result.data };
      exitEditMode();
      showEditAlert('Perfil actualizado correctamente.', 'success');
      document.getElementById('edit-alert').classList.remove('d-none');
    } else {
      const errMsg = result.message || result.detail || 'No se pudo actualizar el perfil.';
      showEditAlert(typeof errMsg === 'string' ? errMsg : JSON.stringify(errMsg));
    }
  } catch (err) {
    showEditAlert(`Error de conexión: ${err.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar';
  }
}

document.getElementById('btn-edit').addEventListener('click', enterEditMode);
document.getElementById('btn-cancel').addEventListener('click', exitEditMode);
document.getElementById('btn-save').addEventListener('click', saveChanges);

// --- INIT ---
async function init() {
  const loadingSection = document.getElementById('loading-section');
  const profileSection = document.getElementById('profile-section');
  const errorSection   = document.getElementById('error-section');

  const user = await loadNavbar({ activePage: 'perfil' });

  if (!user) {
    loadingSection.classList.add('d-none');
    errorSection.classList.remove('d-none');
    return;
  }

  currentUser = user;
  renderUser(user);

  loadingSection.classList.add('d-none');
  profileSection.classList.remove('d-none');
}

init();
</script>

</body>
</html>
